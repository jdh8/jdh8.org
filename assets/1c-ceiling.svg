<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" font-family="sans-serif" font-size="14" role="img" aria-labelledby="t">
  <title id="t">Strength of 1♣ in HCP: Muscat Walsh 11–20, Watermelon Dutch Doubleton 11–23, Strawberry Polish Club 11 with no upper limit</title>
  <style>
    .ink { fill: #0b0b0b; }
    .muted { fill: #52514e; font-size: 12px; }
    .bar { fill: #2a78d6; }
    .grid { stroke: #ddd; stroke-width: 1; }
  </style>
  <!-- plot: x = 200 + (HCP - 10) * 25 -->
  <text class="ink" x="200" y="18" font-weight="700">Strength of 1♣ (HCP)</text>
  <g class="grid">
    <line x1="200" y1="30" x2="200" y2="160"/>
    <line x1="300" y1="30" x2="300" y2="160"/>
    <line x1="400" y1="30" x2="400" y2="160"/>
    <line x1="500" y1="30" x2="500" y2="160"/>
    <line x1="600" y1="30" x2="600" y2="160"/>
  </g>
  <g class="muted" text-anchor="middle">
    <text x="200" y="180">10</text>
    <text x="300" y="180">14</text>
    <text x="400" y="180">18</text>
    <text x="500" y="180">22</text>
    <text x="600" y="180">26</text>
  </g>
  <g class="ink" text-anchor="end">
    <text x="188" y="55">Muscat Walsh</text>
    <text x="188" y="100">Watermelon Dutch</text>
    <text x="188" y="145">Strawberry Polish</text>
  </g>
  <g class="bar">
    <path d="M225 40 H446 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 H225 Z"/>
    <path d="M225 85 H521 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 H225 Z"/>
    <path d="M225 130 H600 l16 10 l-16 10 H225 Z"/>
  </g>
  <g class="ink">
    <text x="458" y="55">11–20</text>
    <text x="533" y="100">11–23</text>
    <text x="624" y="145">11+</text>
  </g>
</svg>
